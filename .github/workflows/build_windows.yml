name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 pynput requests pyinstaller pywin32
    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --name "하람매크로" main.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 하람매크로_윈도우
        path: dist/하람매크로.exe
